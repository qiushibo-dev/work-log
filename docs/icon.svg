<!-- Babos アプリアイコン・ミッドナイト版。1024×1024、余白100px、角丸185。
     形は灰階版と完全に同じ——円の座標も半径も1つも変えていない。色だけ。

     地は #00052e ＝ midnightInk。灰階版の白は同じトークンの mono 側なので、
     これは色の選択ではなくトークンの入れ替え。

     ⚠️ 気泡の符号化は灰階版と違う。灰階版は「大きさ＝投入強度、濃さ＝完了度」の
     2軸だったが、こちらは**濃度の軸を捨てて全部を白寄りにしてある**
     （2026-08-18、小さいサイズでの視認性を優先する判断）。
     残っているのは大きさの軸だけ。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g filter="url(#soft)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#00052e"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="#23242b" stroke-width="1"/>

  <g clip-path="url(#body)">
    <circle cx="680" cy="353" r="132" fill="#c3c8e8"/>
    <circle cx="389" cy="465" r="177" fill="#dfe2f7"/>
    <circle cx="667" cy="611" r="112" fill="#ffffff"/>
    <circle cx="389" cy="723" r="81"  fill="#a5a9cc"/>
  </g>
</svg>
