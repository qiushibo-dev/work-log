<!-- Work Log アプリアイコン。1024×824 は macOS のアイコングリッド（余白100px、角丸185）。
     気泡はアプリ本体と同じ符号化：大きさ＝投入強度、濃さ＝完了度。だから
     「大きいほど濃い」にはなっていない——2つの軸は独立している。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- 白の本体 -->
  <g filter="url(#soft)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#ffffff"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="#e4e4e4" stroke-width="1"/>

  <!-- 気泡クラスター -->
  <g clip-path="url(#body)">
    <circle cx="680" cy="353" r="132" fill="#adadad"/>
    <circle cx="389" cy="465" r="177" fill="#545454"/>
    <circle cx="667" cy="611" r="112" fill="#1a1a1a"/>
    <circle cx="389" cy="723" r="81"  fill="#d2d2d2"/>
  </g>
</svg>
