name: build

# タグを push すると mac / Windows 両方をビルドして Release にぶら下げる。
# 手動実行（workflow_dispatch）の場合は Release を作らず、artifact として残すだけ。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # beforeBuildCommand が node を使うので必要（package.json は無い）
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust のビルドは遅いのでキャッシュする。2回目以降が数分速くなる
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Babos ${{ github.ref_name }}'
          releaseBody: 'macOS は .dmg、Windows は .exe（NSIS インストーラ）。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 🔴 **macOS は .zip も要る。** tauri-action は .dmg しか作らないが、
      # Chrome は GitHub の署名付き CDN から dmg を落とすとき
      # Content-Disposition ではなく URL のパス（UUID）でファイル名を決めるので、
      # 拡張子の無いファイルが保存されて開けなくなる。Safari は正しく扱う。
      # ダウンロード欄には「完了 12.3 MB」と出るので気づきにくい。
      # landing page 側も zip を優先して探しているので、無いと dmg に落ちてしまう。
      - name: macOS の .app を zip に固める
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          APP=$(find src-tauri/target -type d -name 'Babos.app' -path '*/release/bundle/macos/*' | head -1)
          if [ -z "$APP" ]; then echo "::error::Babos.app が見つからない"; exit 1; fi
          VER="${GITHUB_REF_NAME#v}"
          # ditto なら署名とリソースフォークが保たれる。zip コマンドでは壊れる
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Babos_${VER}_macos.zip"
          ls -la "Babos_${VER}_macos.zip"

      - name: zip を Release に足す
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "Babos_${GITHUB_REF_NAME#v}_macos.zip" --clobber

      # 手動実行のときは Release を作らないので、成果物をここに残す
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: babos-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
