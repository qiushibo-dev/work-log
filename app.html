<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Babos</title>
<!-- 和文・中文（Noto Sans JP / TC）。229 断片・917 行あるので別ファイルにしてある。
     欧文は下の <style> 内で直接 @font-face している（4ファイルだけなので）。 -->
<link rel="stylesheet" href="fonts/noto.css">
<style>
/* 欧文も同梱する。以前は Google Fonts から @import していたが、
   オフラインで字が変わるうえ、起動ごとに外部へ取りに行っていた。

   Inter は可変フォントなので1ファイルで 300〜500 を全部持っている。
   ファイルは fonts/ に置き、build.mjs が dist/ へコピーする。
   ブラウザで app.html を直接開く場合も同じ相対パスで解決する。 */
@font-face{
  font-family:'Inter'; font-style:normal; font-weight:300 500; font-display:block;
  src:url('fonts/Inter-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Inter'; font-style:normal; font-weight:300 500; font-display:block;
  src:url('fonts/Inter-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
    U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face{
  font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:block;
  src:url('fonts/PlexMono-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
    U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'IBM Plex Mono'; font-style:normal; font-weight:400; font-display:block;
  src:url('fonts/PlexMono-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,
    U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,
    U+2113,U+2C60-2C7F,U+A720-A7FF;
}

/* Ameba — Style Reference のトークンを使用（角丸のみピル形に戻している）。
   配色は下の意味的トークンを経由させ、テーマ切替はそこだけ差し替える。 */
:root{
  --midnight-ink:#00052e;
  --signal-blue:#0428cb;
  --arc-cyan:#34fcff;
  --halo-violet:#afb4db;
  --slate-body:#4f5166;
  --fog:#6b6b83;
  --mist:#8185a0;
  --paper:#ffffff;
  --violet-wash:#06105a;
  --danger:#e0736b;

  /* 意味的トークン（テーマごとに差し替わるのはここ） */
  --bg:var(--midnight-ink);      /* ページ地 */
  --text:var(--paper);           /* 主要テキスト */
  --line:var(--slate-body);      /* 枠線 */
  --accent:var(--signal-blue);   /* 塗りアクション */
  --on-accent:#ffffff;           /* 塗りの上に乗る文字 */
  --accent-hi:var(--arc-cyan);   /* ホバー時の強調色 */
  --bub-fill:var(--halo-violet); /* 気泡の塗り */
  --bub-text:var(--midnight-ink);/* 気泡のラベル */
  --field:radial-gradient(ellipse 70% 62% at 50% 48%,var(--violet-wash) 0%,var(--midnight-ink) 74%);
  --hover-bg:rgba(6,16,90,.55);      /* 行ホバー */
  --sel-bg:rgba(6,16,90,.85);        /* 選択中の行・項目 */
  --hairline:rgba(79,81,102,.45);    /* 行間の細線 */
  --glow-match:rgba(52,252,255,.30); /* 絞り込みで該当した気泡 */
  --glow-sel:rgba(52,252,255,.45);   /* 選択中の気泡 */
  --flash:rgba(52,252,255,.22);      /* 更新直後の行 */
  --overlay:rgba(0,5,46,.72);
  --legend-from:rgba(175,180,219,.18);
  --legend-to:rgba(175,180,219,1);

  /* 和文・中文も同梱した Noto を最優先にする。OS のフォントは、
     同梱に無い字（Noto の断片が漢字を取りこぼした場合）の受け皿として後ろに置く。
     mono の CJK も本文と同じものを指定する——等幅の和文は総じて汚いため。 */
  --font-cjk:'Noto Sans JP','Noto Sans TC','Hiragino Sans','Yu Gothic UI','PingFang TC','Microsoft JhengHei';
  --font-display:'Inter',var(--font-cjk),ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',var(--font-cjk),ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,var(--font-cjk),monospace;

  --pill:100vh;
  --radius-tags:4px;
  --radius-cards:8px;
}

/* グレースケール：白地・黒／濃灰の線。気泡は淡い灰から黒へ（濃淡＝完了度は同じ）。 */
:root[data-theme="mono"]{
  --bg:#ffffff;
  --text:#141414;
  --line:#c4c4c4;
  --fog:#8c8c8c;
  --mist:#4f4f4f;
  --accent:#141414;
  --on-accent:#ffffff;
  --accent-hi:#141414;
  --bub-fill:#141414;
  --bub-text:#ffffff;
  --field:radial-gradient(ellipse 70% 62% at 50% 48%,#f4f4f4 0%,#ffffff 74%);
  --hover-bg:rgba(0,0,0,.045);
  --sel-bg:rgba(0,0,0,.085);
  --hairline:rgba(0,0,0,.10);
  --glow-match:rgba(0,0,0,.22);
  --glow-sel:rgba(0,0,0,.40);
  --flash:rgba(0,0,0,.13);
  --overlay:rgba(0,0,0,.38);
  --legend-from:rgba(20,20,20,.15);
  --legend-to:rgba(20,20,20,1);
  --danger:#a3352b;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;color:inherit;background:none;border:none;outline:none}

.meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.085em;
  color:var(--fog);text-transform:uppercase}
/* 日本語・繁體中文では mono の大文字化とトラッキングが読みにくいので外す */
:root[lang="ja"] .meta,:root[lang="zh-Hant"] .meta{
  font-family:var(--font-body);font-size:11.5px;letter-spacing:.04em;text-transform:none}

.app{height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:60;flex:none;height:60px;display:flex;
  align-items:center;gap:14px;padding:0 20px;
  background:var(--bg);border-bottom:1px solid var(--line)}
.gear{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  flex:none;color:var(--fog);transition:.18s}
.gear:hover{color:var(--text);background:var(--sel-bg)}
.gear svg{width:17px;height:17px;display:block;transition:transform .35s ease}
.gear:hover svg{transform:rotate(35deg)}
.search{flex:1;max-width:320px;height:32px;border:1px solid var(--line);
  border-radius:var(--pill);padding:0 14px;display:flex;align-items:center}
.search input{width:100%;font-size:13px}
.search input::placeholder{color:var(--fog)}
.search:focus-within{border-color:var(--fog)}
.spacer{flex:1}
.btn{height:34px;padding:0 18px;border-radius:var(--pill);display:grid;
  place-items:center;background:var(--accent);color:var(--on-accent);
  font-size:13px;letter-spacing:.03em;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.86}
.btn.quiet{background:none;border:1px solid var(--line);color:var(--fog)}
.btn.quiet:hover{border-color:var(--text);color:var(--text);opacity:1}

/* ---- upper ---- */
.upper{flex:none;height:clamp(520px,58vh,760px);
  display:grid;grid-template-columns:1fr minmax(420px,34%);
  min-height:0;border-bottom:1px solid var(--line)}

.bubbles{position:relative;overflow:hidden;border-right:1px solid var(--line);
  background:var(--field)}
.bubbles-head{position:absolute;top:16px;left:20px;right:20px;display:flex;
  gap:8px;flex-wrap:wrap;z-index:10}
.chip{height:26px;padding:0 13px;border-radius:var(--pill);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.085em;
  color:var(--fog);transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--fog);color:var(--mist)}
.chip.on{border-color:var(--text);color:var(--text)}

/* 位置はフィルタでは動かさない。サイズが変わったときだけ動き、その移動は補間する。 */
.bub{position:absolute;border-radius:50%;cursor:pointer;background:var(--bub-fill);
  display:grid;place-items:center;color:var(--bub-text);font-weight:500;
  text-align:center;padding:5px;overflow:hidden;
  opacity:var(--op,1);
  transition:width .5s cubic-bezier(.4,0,.2,1),height .5s cubic-bezier(.4,0,.2,1),
             opacity .3s ease,box-shadow .25s ease,transform .18s ease;
  touch-action:none}
.bub.dragging{cursor:grabbing;transform:scale(1.06);z-index:5}
.bub:hover{transform:scale(1.05)}
/* 円の中は横幅が限られるので、2行で打ち切って省略記号を出す */
.bub span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;max-width:76%;line-height:1.24;word-break:break-word}
.bub.match{box-shadow:0 0 22px 5px var(--glow-match)}
.bub.sel{box-shadow:0 0 34px 9px var(--glow-sel)}
.bub.dim{opacity:0 !important;pointer-events:none}
.bub.leaving{animation:float-away 2.1s cubic-bezier(.3,0,.6,1) forwards;
  pointer-events:none;transition:none}
@keyframes float-away{
  0%{transform:translateY(0) scale(1);opacity:var(--op)}
  22%{transform:translateY(-14px) scale(1.14);opacity:1}
  100%{transform:translateY(-340px) scale(.5);opacity:0}
}
.legend{position:absolute;bottom:16px;left:20px;right:20px;display:flex;align-items:center;
  gap:10px;z-index:10;pointer-events:none}
.legend-bar{flex:1;min-width:0;height:8px;border-radius:var(--pill);
  background:linear-gradient(90deg,var(--legend-from),var(--legend-to))}
.bub-empty{position:absolute;inset:0;display:grid;place-items:center;
  color:var(--fog);font-size:13px;text-align:center;padding:40px}

/* ---- detail ---- */
.detail{display:flex;flex-direction:column;min-height:0;padding:18px 22px}
.d-head{flex:none;display:flex;align-items:flex-start;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.d-title{flex:1;min-width:0}
.case-name{font-family:var(--font-display);font-weight:300;font-size:26px;
  line-height:1.4;letter-spacing:-.41px;word-break:break-word;
  cursor:text;border-radius:4px;margin:-2px -6px;padding:2px 6px;transition:background .15s}
.case-name:hover{background:var(--sel-bg)}
/* 編集中の入力欄は見た目を元のテキストに合わせる（枠が出ると位置がずれるため） */
/* サブ行（タイプ／クライアント）もその場で編集する。
   空欄は「—」ではなく「＋ タイプ」と出す。押せると分からなければ機能は無いのと同じ。 */
.sub-edit{cursor:text;border-radius:3px;padding:1px 5px;margin:0 -3px;
  transition:background .15s,color .15s;display:inline-block}
.sub-edit:hover{background:var(--sel-bg);color:var(--text)}
.sub-edit.empty{color:var(--line)}
.sub-edit.empty:hover{color:var(--fog)}
.inline-ac{position:relative;display:inline-block;min-width:120px;vertical-align:baseline}
.inline-ac .ac-list{min-width:190px;right:auto;left:-4px}
.field-edit{font-family:inherit;font-size:inherit;letter-spacing:inherit;color:var(--text);
  width:100%;min-width:110px;border:0;border-bottom:1px solid var(--fog);
  background:none;padding:1px 4px}
.name-edit{font-family:var(--font-display);font-weight:300;font-size:26px;
  line-height:1.4;letter-spacing:-.41px;width:100%;
  border:0;border-bottom:1px solid var(--fog);border-radius:0;
  margin:-2px -6px;padding:2px 6px;background:none;color:var(--text)}
.l-name .name-edit{font-family:var(--font-body);font-size:14px;font-weight:400;
  letter-spacing:0;line-height:1.5;margin:0;padding:0 2px}
.l-name{cursor:text}
.case-sub{margin-top:5px}
.icon-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;flex:none;color:var(--fog);font-size:13px;
  transition:.15s}
.icon-btn:hover{border-color:var(--text);color:var(--text)}

.d-sec{flex:none;padding:14px 0;border-bottom:1px solid var(--line)}
.d-label{margin-bottom:11px}

.steps{display:flex;align-items:center}
.step{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;flex:none;font-family:var(--font-mono);
  font-size:10px;color:var(--fog);transition:.15s}
.step:hover{border-color:var(--text);color:var(--text);transform:scale(1.12)}
.step.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.now{border-color:var(--text);border-width:2px;color:var(--text)}
.step-line{height:1px;background:var(--line);flex:1}
.step-line.done{background:var(--accent)}

.d-logs{flex:1;display:flex;flex-direction:column;min-height:0;
  padding:14px 0;border-bottom:1px solid var(--line)}
.log-scroll{flex:1;overflow-y:auto;min-height:0;margin-right:-8px;padding-right:8px}
.log{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--hairline)}
.log:last-child{border-bottom:0}
.log-date{width:96px;flex:none;padding-top:2px}
.log-body{flex:1;word-break:break-word}
.log-del{flex:none;color:var(--line);font-size:14px;opacity:0;transition:.15s}
.log:hover .log-del{opacity:1}
.log-del:hover{color:var(--text)}
.log-input{flex:none;margin-top:12px;height:38px;border:1px solid var(--line);
  border-radius:var(--pill);display:flex;align-items:center;padding:0 16px;gap:8px;
  transition:border-color .15s}
.log-input:focus-within{border-color:var(--fog)}
.log-input input{flex:1;font-size:13px}
.log-input input::placeholder{color:var(--fog)}

.d-links{flex:none;padding:14px 0 0}
.link{display:flex;align-items:center;gap:10px;padding:5px 0}
.link-tag{height:21px;padding:0 9px;border-radius:var(--pill);
  border:1px solid var(--line);display:grid;place-items:center;flex:none;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.085em;
  color:var(--mist);text-transform:uppercase}
.link-path{flex:1;color:var(--fog);font-size:12.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
a.link-path:hover{color:var(--text)}
.link-del{flex:none;color:var(--line);opacity:0;transition:.15s;font-size:13px}
.link:hover .link-del{opacity:1}
.link-del:hover{color:var(--text)}
.link-add{margin-top:6px;color:var(--fog);font-family:var(--font-mono);
  font-size:11px;letter-spacing:.085em}
.link-add:hover{color:var(--text)}

.d-foot{flex:none;display:flex;justify-content:flex-end;padding:14px 0 2px}
.danger{height:28px;padding:0 14px;border-radius:var(--pill);
  border:1px solid var(--line);color:var(--line);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.085em;
  text-transform:uppercase;transition:.15s}
.danger:hover{border-color:var(--danger);color:var(--danger)}

.newform{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:16px}
.newform .field{margin-bottom:16px}
.newform .field input{width:100%;height:38px;border:1px solid var(--line);
  border-radius:var(--pill);padding:0 16px;font-size:13px}
.newform .field input:focus{border-color:var(--fog)}
.newform .field label{display:block;margin-bottom:7px}
.newform-foot{margin-top:auto;padding-top:16px;display:flex;gap:10px;align-items:center}
.newform-hint{flex:1;color:var(--fog);font-family:var(--font-mono);
  font-size:11px;letter-spacing:.085em}

/* autocomplete */
.ac{position:relative}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:10;
  background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius-cards);padding:4px;display:none;
  max-height:180px;overflow-y:auto}
.ac-list.on{display:block}
.ac-item{display:block;width:100%;text-align:left;padding:7px 12px;
  border-radius:var(--pill);font-size:13px;color:var(--mist);transition:.12s}
.ac-item:hover,.ac-item.on{background:var(--sel-bg);color:var(--text)}

/* ---- lower ---- */
/* 区切り線は擬似要素ではなく背景で描く。
   ::before は grid の第一子として 1 列目を占領してしまうため。
   背景なら常にコンテナの高さ＝下端まで届き、レイアウトにも影響しない。 */
/* スクロールは左右それぞれが持つ。.lower 自体は動かない。
   以前は .lower が唯一のスクロールコンテナで、.side は position:sticky で
   「動いていないように見せていた」だけだった——**左を送ると右も動いた**。 */
.lower{flex:1;min-height:0;overflow:hidden;display:grid;
  grid-template-columns:220px 1fr;
  background:linear-gradient(var(--line),var(--line)) no-repeat 220px 0 / 1px 100%}
/* min-height:0 が無いと grid アイテムは内容の高さを主張して overflow が効かない */
.side{padding:16px 0;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.side-grp{padding:0 16px 18px}
.side-grp .d-label{padding:0 8px;margin-bottom:6px}
.side-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;
  padding:0 8px;border-radius:var(--pill);color:var(--mist);font-size:13px;
  transition:.15s;text-align:left}
.side-item:hover{color:var(--text)}
.side-item.on{color:var(--text);background:var(--sel-bg)}
.side-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;
  letter-spacing:.085em;color:var(--fog)}

.list{display:flex;flex-direction:column;min-height:0;overflow-y:auto;
  overscroll-behavior:contain}
/* sticky は .list（自分のスクロールコンテナ）に対して効く。
   背景が .lower の区切り線（左端 1px）を塗り潰すため、そこだけ透かす */
.l-head{position:sticky;top:0;z-index:20;flex:none;display:grid;
  grid-template-columns:1fr 92px 108px 118px 104px 64px;gap:14px;padding:12px 20px;
  background:linear-gradient(90deg,transparent 0 1px,var(--bg) 1px);
  border-bottom:1px solid var(--line)}
.l-body{flex:1}
.l-row{display:grid;grid-template-columns:1fr 92px 108px 118px 104px 64px;gap:14px;
  padding:0 20px;align-items:center;height:50px;width:100%;text-align:left;
  border-bottom:1px solid var(--hairline);transition:background .15s;cursor:pointer}
.l-row:hover{background:var(--hover-bg)}
.l-row.sel{background:var(--sel-bg)}
.l-row.flash{animation:row-flash 1.5s ease-out 1}
@keyframes row-flash{
  0%{background:var(--flash)}
  100%{background:transparent}
}
.detail-pill{height:21px;padding:0 12px;border-radius:var(--pill);
  border:1px solid var(--line);display:inline-grid;place-items:center;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.085em;
  color:var(--fog);text-transform:uppercase;transition:.15s}
.detail-pill:hover{border-color:var(--accent-hi);color:var(--accent-hi)}
/* 案件名以外は見出しと値をまとめて中央揃えにする */
.l-head > :not(:first-child),
.l-row  > :not(:first-child){text-align:center}
.dot-wrap{justify-content:center}
.l-name{display:flex;align-items:center;min-width:0}
.l-name .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;
  border-radius:3px;padding:1px 4px;margin:0 -4px;transition:background .15s}
.l-name .txt:hover{background:var(--sel-bg)}
.l-name .cl{color:var(--fog);font-size:12px;margin-left:10px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 重要度：5つの点をドラッグでなぞって決める。同じ値をもう一度押すと解除。 */
.pri{display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:14px;
  padding:6px 2px;touch-action:none;cursor:pointer}
.pri-dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--line);
  transition:background .12s,border-color .12s,transform .12s}
.pri:hover .pri-dot{border-color:var(--fog)}
.pri-dot.on{background:var(--text);border-color:var(--text)}
.pri:hover .pri-dot.on{transform:scale(1.15)}
.dot-wrap{display:flex;align-items:center;gap:8px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--bub-fill);flex:none}
.pct{font-family:var(--font-mono);font-size:11px;letter-spacing:.085em;color:var(--mist)}
.stage{height:21px;padding:0 10px;border-radius:var(--pill);
  border:1px solid var(--line);display:inline-grid;place-items:center;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.085em;color:var(--fog);
  white-space:nowrap;transition:.15s}
.stage.near{border-color:var(--fog);color:var(--text)}
.stage.fin{border-color:var(--line);color:var(--line)}
.stage.idle{border-color:var(--fog);color:var(--mist)}
button.stage:hover{border-color:var(--accent-hi);color:var(--accent-hi)}
.l-date,.l-links{font-family:var(--font-mono);font-size:11px;
  letter-spacing:.085em;color:var(--fog)}
/* 見出しは押せる。押している列だけ色を上げ、矢印で向きを示す。 */
.col-sort{font-family:inherit;font-size:inherit;letter-spacing:inherit;
  text-transform:inherit;color:inherit;padding:0;transition:color .15s;
  white-space:nowrap;text-align:inherit}
.col-sort:hover{color:var(--mist)}
.col-sort.on{color:var(--text)}
.col-sort .ar{margin-left:5px;opacity:.75}
.l-empty{padding:48px 20px;text-align:center;color:var(--fog);font-size:13px}

/* ---- modal ---- */
.modal{position:fixed;inset:0;background:var(--overlay);display:none;
  place-items:center;z-index:100;overflow-y:auto;padding:32px 16px}
.modal.on{display:grid}
.sheet{width:400px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius-cards);padding:24px}
.sheet h3{font-family:var(--font-display);font-weight:300;font-size:20px;
  margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:6px}
.field input{width:100%;height:36px;border:1px solid var(--line);
  border-radius:var(--pill);padding:0 14px;font-size:13px}
.field input:focus{border-color:var(--fog)}
.field-row{display:flex;gap:8px}
.seg{flex:1;height:32px;border:1px solid var(--line);border-radius:var(--pill);
  display:grid;place-items:center;font-size:12px;color:var(--fog);transition:.15s}
.seg:hover{border-color:var(--fog)}
.seg.on{border-color:var(--text);color:var(--text)}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.sheet-note{color:var(--fog);font-size:13px;line-height:1.7}

/* case detail window */
.sheet.wide{width:min(880px,92vw)}
.dt-sub{margin:-10px 0 18px}
.dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.dt-col{display:flex;flex-direction:column;min-width:0}
.dt-col > .meta{margin-bottom:8px}
#dtMemo{width:100%;height:280px;resize:vertical;
  border:1px solid var(--line);border-radius:var(--radius-cards);
  padding:14px 16px;font-family:inherit;font-size:13px;line-height:1.7;
  color:var(--text);background:none;outline:none}
#dtMemo:focus{border-color:var(--fog)}
#dtMemo::placeholder{color:var(--fog)}
.dt-logs{height:280px;overflow-y:auto;border:1px solid var(--line);
  border-radius:var(--radius-cards);padding:6px 14px}
.dt-log{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--hairline)}
.dt-log:last-child{border-bottom:0}
.dt-log .meta{width:96px;flex:none;padding-top:2px}
.dt-log .txt{flex:1;font-size:13px;word-break:break-word}
.dt-empty{padding:14px 0;color:var(--fog);font-size:13px}

/* settings */
.sheet.settings{width:min(560px,92vw)}
.set-sec{padding:20px 0;border-top:1px solid var(--line)}
.set-sec:first-of-type{padding-top:0;border-top:0}
.set-sec > .meta{margin-bottom:12px}
.set-hint{color:var(--fog);font-size:12.5px;line-height:1.6;margin-bottom:12px}
.tag-group{margin-bottom:20px}
.tag-group:last-child{margin-bottom:0}
.tag-group > .meta{margin-bottom:9px}
.tag-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.tag-item{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 12px;
  border-radius:var(--pill);border:1px solid var(--line);
  font-size:12.5px;color:var(--mist)}
.tag-item .n{font-family:var(--font-mono);font-size:10px;color:var(--fog)}
.tag-item .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  color:var(--line);font-size:12px;line-height:1;transition:.15s}
.tag-item .x:hover{color:var(--danger)}
.tag-empty{color:var(--fog);font-size:12.5px;margin-bottom:10px}
.tag-add{display:flex;gap:8px}
.tag-add input{flex:1;height:32px;border:1px solid var(--line);
  border-radius:var(--pill);padding:0 14px;font-size:13px}
.tag-add input:focus{border-color:var(--fog)}
.tag-add button{height:32px;padding:0 16px;border-radius:var(--pill);
  border:1px solid var(--line);color:var(--fog);font-size:12.5px;transition:.15s}
.tag-add button:hover{border-color:var(--text);color:var(--text)}
/* スライダー：0〜15分。0 は Off。ドラッグ中も即座に数値が動く。 */
.slider-row{display:flex;align-items:center;gap:16px}
.slider{position:relative;flex:1;height:30px;display:flex;align-items:center;
  cursor:pointer;touch-action:none}
.slider-track{width:100%;height:2px;background:var(--line);border-radius:100vh}
.slider-fill{height:100%;background:var(--text);border-radius:100vh;width:0}
.slider-knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  background:var(--text);transform:translate(-50%,-50%);transition:transform .12s;
  pointer-events:none}
.slider:hover .slider-knob{transform:translate(-50%,-50%) scale(1.25)}
.slider-val{min-width:74px;text-align:right;color:var(--text)}
.about{display:flex;flex-direction:column;gap:7px}
.about-row{display:flex;gap:14px;font-size:13px}
.about-row .k{width:96px;flex:none;color:var(--fog)}
.about-row .v{color:var(--mist)}

/* ---- screen saver ----
   一定時間無操作で気泡だけの全画面へ。物理は fieldBox() を毎フレーム読むので、
   画面が広がると気泡が自然に散らばっていく。 */
body.saver .topbar,body.saver .detail,body.saver .lower{
  opacity:0;pointer-events:none;transition:opacity .9s ease}
/* grid のままだと .detail が 2 行目を占め、気泡が上半分しか使えない。
   ただし block 化＋absolute はクラッシュの容疑があるため、
   grid 構造は保ったまま列と行を 1 つにし、.detail を流し込みから外すだけにする。 */
body.saver .upper{position:fixed;inset:0;height:100vh;z-index:200;
  border:0;grid-template-columns:1fr;grid-template-rows:1fr;transition:none}
body.saver .detail{display:none}
body.saver .bubbles{border:0}
body.saver .bubbles-head,body.saver .legend{opacity:0;transition:opacity .9s ease}
body.saver .bub{cursor:default}
.topbar,.detail,.lower,.bubbles-head,.legend{transition:opacity .5s ease}
.saver-clock{position:fixed;right:44px;bottom:38px;z-index:210;opacity:0;
  pointer-events:none;transition:opacity 1.4s ease;text-align:right;
  font-family:var(--font-mono);letter-spacing:.14em;color:var(--fog)}
body.saver .saver-clock{opacity:.5}
.saver-clock .t{font-size:26px;display:block;line-height:1.2}
.saver-clock .n{font-size:11px;letter-spacing:.18em}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--pill)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

/* 既定は Ameba。mono は白地・黒／濃灰のグレースケール。 */
function applyTheme(t){

   Storage — localStorage に JSON 1件。一人で数十件なので DB は不要。

const KEY = 'work-tracker-v1';

function sampleCases(){
  const base = Date.now();
  /* 初回起動時の5件。すべて着手前（step 0）＝最小サイズ・最も淡い状態から始まる。
     進捗を進めると気泡が育つ、という基本動作をユーザー自身の手で確認できる。 */
  return ['A','B','C','D','E'].map((k,i) => ({
    id:'sample-'+k, name:'Project '+k,
    type:'', client:'', step:0, memo:'',
    done:false, waiting:false,
    created:new Date(base - i*60000).toISOString(),
    updated:new Date(base - i*60000).toISOString(),
    logs:[], links:[]
  }));

let state = load();
let selectedId = null;
let mode = 'case';
let lastTouched = null;
let filter = { status:'all', client:null, type:null, q:'' };
let sortBy = { key:'updated', dir:-1 };
if(state.sortBy && state.sortBy.key) sortBy = state.sortBy;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { cases: sampleCases(), fresh:true };
}
const DATA_FILE = 'work-tracker.json';

/* localStorage は即時・同期のまま保険として残し、実体は JSON ファイルへ書く。
   Tauri が無い環境では従来どおり localStorage のみで動く。 */
function save(){
  const json = JSON.stringify(state, null, 2);
  try{ localStorage.setItem(KEY, json); }catch(e){}
  writeFile(json);
}

/* 保存状態。About 画面に出す。
   以前は失敗を console.warn だけで握りつぶしていたため、
   release ビルド（devtools 無し）では書き込みが一度も成功していないことに
   気づけなかった。表に出す。 */
let fileState = { ok:null, msg:'', path:'' };

/* writeTextFile は親ディレクトリを作らない。
   AppData（~/Library/Application Support/<identifier>/）は初回起動時点では
   存在しないので、書く前に必ず作る。 */
let _dirReady = false;
async function ensureDir(t){
  if(_dirReady) return;
  const AD = t.fs.BaseDirectory.AppData;
  try{
    await t.fs.mkdir('', { baseDir: AD, recursive: true });
  }catch(e){
    // 空文字を受けつけない版があるため、絶対パスで作り直す
    const dir = await t.path.appDataDir();
    await t.fs.mkdir(dir, { recursive: true });
  }
  _dirReady = true;
}

/* 起動直後は書かない。localStorage から起こした古い state を先に書いてしまうと、
   まだ読み込み中の JSON ファイル（＝正）を潰す。loadFromFile() が終わるまで閉じておく。
   別マシンから work-tracker.json を持ってきた場合に効く。 */
let booted = false;

let _wt = null;
function writeFile(json){
  if(!booted) return;
  const t = TA();
  if(!t?.fs){ fileState = { ok:false, msg:'browser', path:'' }; return; }
  clearTimeout(_wt);
  _wt = setTimeout(async () => {
    try{
      await ensureDir(t);
      await t.fs.writeTextFile(DATA_FILE, json, { baseDir: t.fs.BaseDirectory.AppData });
      const dir = await t.path.appDataDir().catch(() => '');
      const sep = dir && !dir.endsWith('/') ? '/' : '';
      fileState = { ok:true, msg:'', path: dir ? dir + sep + DATA_FILE : DATA_FILE };
    }catch(e){
      fileState = { ok:false, msg:String(e && e.message || e), path:'' };
      console.warn('[babos] file write failed:', e);
    }
    if($('modalSettings').classList.contains('on')) renderSettings();
  }, 400);
}

/* 起動時：ファイルがあればそれを正とする（localStorage より確実な実体） */
async function loadFromFile(){
  const t = TA();
  if(!t?.fs){ booted = true; return; }
  try{
    const txt = await t.fs.readTextFile(DATA_FILE, { baseDir: t.fs.BaseDirectory.AppData });
    const parsed = JSON.parse(txt);
    if(parsed && Array.isArray(parsed.cases)){
      state = parsed;
      if(state.sortBy && state.sortBy.key) sortBy = state.sortBy;
      applyTheme(state.theme || 'ameba');
      applyLang(state.lang || 'en');
    }
  }catch(e){ /* 初回起動でファイルが無いのは正常 */ }
  booted = true;
  save();   // ゲートを開けてから、確定した state を1度だけ書き戻す
}

const now = () => new Date().toISOString();

/* タグは案件から集めるだけでなく、設定で先に登録することもできる。
   候補＝登録済みタグ ∪ 実際に使われている値。 */
const inUse  = key => [...new Set(state.cases.map(c => c[key]).filter(Boolean))];
const poolOf = key => [...new Set([...(state.tags?.[key] || []), ...inUse(key)])].sort();
const usageOf = (key, value) => state.cases.filter(c => c[key] === value).length;

function touch(c){ c.updated = now(); lastTouched = c.id; }

const pad = n => String(n).padStart(2,'0');
const fmtDate  = iso => { const d=new Date(iso); return pad(d.getMonth()+1)+'/'+pad(d.getDate()); };
const fmtStamp = iso => { const d=new Date(iso);
  return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const fmtFull  = iso => { const d=new Date(iso);
  return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate()); };

const progOf  = c => c.step / 10;
/* 気泡サイズ。console から SIZE を書き換えて renderAll() すれば即座に反映される。
   floor を下げるほど「着手直後」と「山場」の差が開く。 */
let SIZE = { base:16, span:144, floor:0.18 };
const sizeOf  = p => SIZE.base + SIZE.span * (SIZE.floor + (1-SIZE.floor) * Math.sin(p * Math.PI));
const opOf    = p => 0.18 + 0.82 * p;
const bubSize = c => Math.round(sizeOf(progOf(c)));

function statusOf(c){
  if(c.done) return 'done';
  if(c.waiting) return 'idle';
  return progOf(c) > .85 ? 'near' : 'active';
}

const esc = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ---- filtering ---- */
function matchQ(c){
  if(!filter.q) return true;
  const q = filter.q.toLowerCase();
  return [c.name, c.client, c.type].some(v => (v||'').toLowerCase().includes(q));
}
const matchSide = c => (!filter.client || c.client===filter.client)
                    && (!filter.type   || c.type===filter.type);
const isFiltering = () =>
  filter.status !== 'all' || !!filter.client || !!filter.type || !!filter.q;

function bubbleCases(){
  return state.cases.filter(c => !c.done && matchQ(c) && matchSide(c)
    && (filter.status==='all' || statusOf(c)===filter.status));
}
function listCases(){
  return state.cases.filter(c => matchQ(c) && matchSide(c)
    && (filter.status==='all' ? !c.done : statusOf(c)===filter.status))
    .sort((a,b) => {
      const va = sortVal(a, sortBy.key), vb = sortVal(b, sortBy.key);
      if(va < vb) return -sortBy.dir;
      if(va > vb) return  sortBy.dir;
      return b.updated.localeCompare(a.updated);   // 同値なら更新順で安定させる
    });
}

function current(){
  if(selectedId){
    const c = state.cases.find(x => x.id===selectedId);
    if(c) return c;
  }
  const alive = state.cases.filter(c => !c.done);
  const pool = alive.length ? alive : state.cases;
  return pool.slice().sort((a,b) => b.updated.localeCompare(a.updated))[0] || null;
}

/* ---- bubble physics ----
   一発計算ではなく毎フレーム解く。風船同士が実際に押し合い、掴んで動かせる。 */
const bubEls = new Map();
const bodies = new Map();          // id -> {x,y,vx,vy,r}
const PADB = { top:66, bottom:46, side:16 };
let physRunning = false;

function fieldBox(){
  const b = $('bubbles');
  return { W:b.clientWidth || 900, H:b.clientHeight || 600 };
}

/* 新しい気泡は外周から入ってくる（いきなり中央に湧かない） */
function syncBody(id, size){
  const r = size/2;
  const b = bodies.get(id);
  if(b){ b.r = r; return b; }
  const { W, H } = fieldBox();
  const cx = W/2, cy = (PADB.top + (H-PADB.bottom))/2;
  const a = Math.random() * Math.PI * 2;
  const nb = { x: cx + Math.cos(a)*(W*0.42), y: cy + Math.sin(a)*(H*0.34),
               vx:0, vy:0, r, drag:false };
  bodies.set(id, nb);
  return nb;
}

let physPaused = false;

function tick(){
  if(physPaused){ requestAnimationFrame(tick); return; }
  const { W, H } = fieldBox();
  const cx = W/2, cy = (PADB.top + (H-PADB.bottom))/2;
  const list = [...bodies.entries()];

  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      const a = list[i][1], b = list[j][1];
      const dx = b.x-a.x, dy = b.y-a.y;
      const d  = Math.hypot(dx,dy) || .01;
      const min = a.r + b.r + 6;
      if(d < min){
        const push = (min-d)/d * 0.22;
        const ox = dx*push, oy = dy*push;
        if(!a.drag){ a.x -= ox; a.y -= oy; a.vx -= ox*0.35; a.vy -= oy*0.35; }
        if(!b.drag){ b.x += ox; b.y += oy; b.vx += ox*0.35; b.vy += oy*0.35; }
      }
    }
  }

  for(const [id, b] of list){
    if(!b.drag){
      b.vx += (cx-b.x)*0.0007 + (Math.random()-0.5)*0.055;   // 中心へ + 微かな揺らぎ
      b.vy += (cy-b.y)*0.0007 + (Math.random()-0.5)*0.055;
      const damp = saverOn ? 0.972 : 0.935;                  // セーバー中はもっと漂う
      b.vx *= damp; b.vy *= damp;
      b.x += b.vx;   b.y += b.vy;
      if(b.x-b.r < PADB.side)     { b.x = PADB.side + b.r;     b.vx *= -0.42; }
      if(b.x+b.r > W-PADB.side)   { b.x = W - PADB.side - b.r;  b.vx *= -0.42; }
      if(b.y-b.r < PADB.top)      { b.y = PADB.top + b.r;       b.vy *= -0.42; }
      if(b.y+b.r > H-PADB.bottom) { b.y = H - PADB.bottom - b.r; b.vy *= -0.42; }
    }
    const el = bubEls.get(id);
    if(el && !el.classList.contains('leaving')){
      el.style.left = (b.x - b.r) + 'px';
      el.style.top  = (b.y - b.r) + 'px';
    }
  }
  requestAnimationFrame(tick);
}
function startPhysics(){ if(physRunning) return; physRunning = true; requestAnimationFrame(tick); }

/* ドラッグ：5px 以上動いたら選択ではなく移動とみなす */
function attachDrag(el, id){
  let sx=0, sy=0, moved=false, body=null;
  el.addEventListener('pointerdown', e => {
    body = bodies.get(id); if(!body) return;
    body.drag = true; moved = false;
    sx = e.clientX - body.x; sy = e.clientY - body.y;
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if(!body || !body.drag) return;
    const nx = e.clientX - sx, ny = e.clientY - sy;
    if(Math.abs(nx-body.x) + Math.abs(ny-body.y) > 5) moved = true;
    body.vx = nx - body.x; body.vy = ny - body.y;   // 離した時に慣性が残る
    body.x = nx; body.y = ny;
  });
  const end = () => {
    if(!body) return;
    body.drag = false; el.classList.remove('dragging');
    setTimeout(()=>{ moved = false; }, 0);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('click', e => { if(moved){ e.stopImmediatePropagation(); } }, true);
}

/* ---- rendering ---- */
const $ = id => document.getElementById(id);

function renderChips(){
  const counts = { all:0, active:0, idle:0, near:0 };
  state.cases.filter(c=>!c.done).forEach(c=>{ counts.all++; counts[statusOf(c)]++; });
  const defs = [['all',T.all],['active',T.active],['idle',T.idle],['near',T.near]];
  $('chips').innerHTML = defs.map(([k,label]) =>
    `<button class="chip${filter.status===k?' on':''}" data-status="${k}">${label} ${counts[k]||0}</button>`
  ).join('');
}

function renderBubbles(){
  const box = $('bubbles');
  const all = state.cases.filter(c => !c.done);
  const alive = new Set(all.map(c=>c.id));
  for(const id of [...bodies.keys()]) if(!alive.has(id)) bodies.delete(id);

  for(const [id, el] of [...bubEls]){
    if(!alive.has(id)){ el.remove(); bubEls.delete(id); }
  }
  box.querySelectorAll('.bub-empty').forEach(el=>el.remove());
  if(!all.length){
    const d = document.createElement('div');
    d.className = 'bub-empty';
    d.textContent = state.cases.length ? T.noBubbles : T.noCasesYet;
    box.appendChild(d);
    return;
  }

  const visible = new Set(bubbleCases().map(c=>c.id));
  const filtering = isFiltering();
  const cur = current();

  if(!visible.size){
    const d = document.createElement('div');
    d.className = 'bub-empty';
    d.textContent = T.noBubbles;
    box.appendChild(d);
  }

  all.forEach((c,i)=>{
    let el = bubEls.get(c.id);
    if(!el){
      el = document.createElement('button');
      el.className = 'bub';
      el.dataset.id = c.id;
      el.onclick = () => { selectedId = c.id; mode = 'case'; renderAll(); };
      box.appendChild(el);
      bubEls.set(c.id, el);
      attachDrag(el, c.id);
    }
    const s = bubSize(c);
    syncBody(c.id, s);
    el.style.width = el.style.height = s+'px';
    el.style.setProperty('--op', opOf(progOf(c)));
    /* 字級は円の大きさに追従（52px→8.5px、160px→13px あたり） */
    el.style.fontSize = (9 + Math.max(0, s-42) * 0.034).toFixed(1) + 'px';
    el.innerHTML = `<span>${esc(c.name)}</span>`;
    el.title = `${c.name} · ${Math.round(progOf(c)*100)}%`;
    el.classList.toggle('dim', !visible.has(c.id));
    el.classList.toggle('match', filtering && visible.has(c.id));
    el.classList.toggle('sel', !!cur && cur.id === c.id && visible.has(c.id));
  });
}

function renderSide(){

  alive.forEach(c=>counts[statusOf(c)]++);
  const doneCount = state.cases.filter(c=>c.done).length;

  const tally = key => {
    const m = {};
    state.cases.forEach(c=>{ if(c[key]) m[c[key]] = (m[c[key]]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  };
  /* 各グループ先頭の「All」＝そのグループの絞り込み解除 */
  const group = (label, attr, entries, activeVal) => entries.length ? `
    <div class="side-grp">

      <button class="side-item${activeVal?'':' on'}" data-${attr}="">
        ${T.all} <span class="side-count">${state.cases.length}</span></button>
      ${entries.map(([name,n])=>
        `<button class="side-item${activeVal===name?' on':''}" data-${attr}="${esc(name)}">
          ${esc(name)} <span class="side-count">${n}</span></button>`).join('')}
    </div>` : '';

  $('side').innerHTML = `
    <div class="side-grp">
      <div class="meta d-label">${T.statusGroup}</div>
      ${[['all',alive.length],['active',counts.active],['idle',counts.idle],
         ['near',counts.near],['done',doneCount]]
        .map(([k,n])=>`<button class="side-item${filter.status===k?' on':''}" data-status="${k}">
          ${k==='all'?T.all:STATUS_LABEL[k]} <span class="side-count">${n}</span></button>`).join('')}
    </div>
    ${group(T.typeGroup,  'type',   tally('type'),   filter.type)}
    ${group(T.clientGroup,'client', tally('client'), filter.client)}`;
}

/* 並び替え。dir: -1 = 降順、1 = 昇順。名前だけ既定を昇順にする（あいうえお順が自然なので） */
const STATUS_ORDER = { active:0, near:1, idle:2, done:3 };
const SORT_COLS = [
  { key:'name',    t:'colCase'    },
  { key:null,      t:'detail'     },   // 操作ボタンの列なので並び替え対象外
  { key:'step',    t:'progress'   },
  { key:'status',  t:'colStatus'  },
  { key:'updated', t:'colUpdated' },
  { key:'links',   t:'links'      },
];

function sortVal(c, key){
  switch(key){
    case 'name':    return (c.name||'').toLowerCase();
    case 'step':    return c.step;
    case 'status':  return STATUS_ORDER[statusOf(c)];
    case 'links':   return (c.links||[]).length;
    default:        return c.updated;
  }
}

function renderHead(){
  $('lhead').innerHTML = SORT_COLS.map(col => {
    if(!col.key) return `<div class="meta">${T[col.t]}</div>`;
    const on = sortBy.key === col.key;
    const ar = on ? `<span class="ar">${sortBy.dir < 0 ? '↓' : '↑'}</span>` : '';
    return `<button class="meta col-sort${on?' on':''}" data-sort="${col.key}">${T[col.t]}${ar}</button>`;
  }).join('');
}

function renderList(){
  const list = listCases();
  const cur = current();
  if(!list.length){
    $('rows').innerHTML = `<div class="l-empty">${T.noRows}</div>`;
    return;
  }
  $('rows').innerHTML = list.map(c=>{
    const st = statusOf(c), p = progOf(c);
    const flash = c.id === lastTouched ? ' flash' : '';
    const stage = c.done
      ? `<span class="stage fin">${STATUS_LABEL.done}</span>`
      : `<button class="stage ${st}" data-toggle="${c.id}" title="${T.toggleStatus}">${STATUS_LABEL[st]}</button>`;
    return `<div class="l-row${cur&&cur.id===c.id?' sel':''}${flash}" data-id="${c.id}" role="button" tabindex="0">
      <div class="l-name"><span class="txt" data-rename="${c.id}" title="${T.renameHint2}">${esc(c.name)}</span
        ><span class="cl">${[c.type,c.client].filter(Boolean).map(esc).join(' · ')}</span
        ><span class="pri" data-pri="${c.id}" title="${T.priorityHint}">${
          [1,2,3,4,5].map(n => `<span class="pri-dot${n <= (c.priority||0) ? ' on' : ''}"></span>`).join('')
        }</span></div>
      <div><button class="detail-pill" data-detail="${c.id}">${T.detail}</button></div>
      <div class="dot-wrap"><div class="dot" style="opacity:${opOf(p)}"></div>
        <span class="pct">${Math.round(p*100)}%</span></div>
      <div>${stage}</div>
      <div class="l-date">${fmtDate(c.updated)}</div>
      <div class="l-links">${(c.links||[]).length}</div>
    </div>`;
  }).join('');
  lastTouched = null;
}

function renderAll(){
  renderChips(); renderBubbles(); renderDetail(); renderSide(); renderHead(); renderList();
  if($('modalSettings').classList.contains('on')) renderSettings();
}

/* ---- settings ---- */
function renderSettings(){
  document.querySelectorAll('#langSeg .seg').forEach(s =>
    s.classList.toggle('on', s.dataset.lang === lang));
  document.querySelectorAll('#themeSeg .seg').forEach(s =>
    s.classList.toggle('on', s.dataset.theme === theme));
  initSaverSlider();
  paintSaver(Math.round(saverDelay / 60000));

  const group = (key, label) => {
    const tags = poolOf(key);
    return `
      <div class="tag-group">
        <div class="meta">${label}</div>
        ${tags.length ? `<div class="tag-list">${tags.map(t=>`
          <span class="tag-item">${esc(t)}<span class="n">${usageOf(key,t)}</span>
            <button class="x" data-tagdel="${key}" data-tagval="${esc(t)}">×</button></span>`).join('')}</div>`
          : `<div class="tag-empty">${T.noTags}</div>`}
        <div class="tag-add">
          <input data-tagadd="${key}" placeholder="${T.phTag}">
          <button data-tagaddbtn="${key}">${T.tagAdd}</button>
        </div>
      </div>`;
  };
  $('tagPanel').innerHTML = group('type', T.typeGroup) + group('client', T.clientGroup);

  /* 保存先は「どこに書けたか」を実際の状態で出す。
     ここが赤いままなら JSON ファイルは書けておらず、localStorage だけで動いている。 */
  const st = fileState.ok === true
      ? `<span style="color:var(--text)">${esc(fileState.path || DATA_FILE)}</span>`
    : fileState.ok === false && fileState.msg === 'browser'
      ? T.storageLocal
    : fileState.ok === false
      ? `<span style="color:var(--danger)">${T.storageFailed}</span><br>
         <span style="font-size:12px;color:var(--fog)">${esc(fileState.msg)}</span>`
      : `<span style="color:var(--fog)">${T.storagePending}</span>`;
  $('aboutPanel').innerHTML = `
    <div class="about-row"><span class="k">${T.version}</span><span class="v">${APP_VERSION}</span></div>
    <div class="about-row"><span class="k">${T.author}</span><span class="v">${esc(APP_AUTHOR)}${APP_ORG ? ' · ' + esc(APP_ORG) : ''}</span></div>
    <div class="about-row"><span class="k">${T.storage}</span><span class="v">${st}</span></div>`;

/* ---- language ---- */
function applyLang(l){
  lang = STRINGS[l] ? l : 'en';
  T = STRINGS[lang];
  STATUS_LABEL = { active:T.active, idle:T.idle, near:T.near, done:T.done };
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : lang;

  document.querySelectorAll('[data-t]').forEach(el => {
    const v = T[el.dataset.t];
    if(typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-tp]').forEach(el => {
    const v = T[el.dataset.tp];
    if(typeof v === 'string') el.placeholder = v;
  });
  document.querySelectorAll('[data-tt]').forEach(el => {
    const v = T[el.dataset.tt];
    if(typeof v === 'string'){ el.title = v; el.setAttribute('aria-label', v); }
  });

  state.lang = lang; save();
  renderAll();
}

/* ---- actions ---- */
/* Tauri の confirm / fs は async。ブラウザでも動くようラップする */
const TA = () => window.__TAURI__ || null;

async function ask(msg){
  const t = TA();
  if(t?.dialog?.confirm){
    try{ return await t.dialog.confirm(msg, { title:'Babos', kind:'warning' }); }
    catch(e){ return window.confirm(msg); }
  }
  return window.confirm(msg);
}

function setStep(c, n){
  const next = (c.step === n) ? n-1 : n;
  if(next >= 10){ finish(c); return; }
  c.step = Math.max(0, next);
  c.done = false;
  touch(c); save(); renderAll();
}

async function finish(c){
  if(!await ask(T.confirmFinish(c.name))) return;
  c.step = 10; touch(c);
  const el = bubEls.get(c.id);
  if(el){
    el.classList.add('leaving');
    save();
    setTimeout(()=>{ c.done = true; save(); renderAll(); }, 2000);
  }else{
    c.done = true; save(); renderAll();
  }
}

/* その場で名前を書き換える。編集中は renderAll を呼ばない（DOM ごと消えるため） */
function editName(c, host){
  if(host.querySelector('.name-edit')) return;
  const keep = host.innerHTML;
  const input = document.createElement('input');
  input.className = 'name-edit';
  input.value = c.name;
  host.innerHTML = '';
  host.appendChild(input);
  input.focus(); input.select();
  let closed = false;
  const commit = ok => {
    if(closed) return; closed = true;
    const v = input.value.trim();
    if(ok && v && v !== c.name){ c.name = v; touch(c); save(); renderAll(); }
    else { host.innerHTML = keep; }
  };
  input.addEventListener('blur', () => commit(true));
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if(e.key === 'Enter'){ e.preventDefault(); commit(true); }
    if(e.key === 'Escape'){ e.preventDefault(); commit(false); }
  });
}

/* タイプ／クライアントの編集。既存の値から候補を出す（新語もそのまま登録される） */
function editField(c, key, host){
  if(host.querySelector('input')) return;
  const keep = host.innerHTML, keepCls = host.className;
  const wrap = document.createElement('span'); wrap.className = 'inline-ac';
  const input = document.createElement('input'); input.className = 'field-edit';
  const list = document.createElement('div'); list.className = 'ac-list';
  input.value = c[key] || '';
  wrap.append(input, list);
  host.className = keepCls.replace('empty','').trim();
  host.innerHTML = ''; host.appendChild(wrap);
  input.focus(); input.select();

  let items = [], active = -1, closed = false;
  const paint = () => {
    const q = input.value.trim().toLowerCase();
    items = poolOf(key).filter(v => v.toLowerCase().includes(q) && v.toLowerCase() !== q);
    if(!items.length){ list.classList.remove('on'); return; }
    list.innerHTML = items.map((v,i) =>
      `<button type="button" class="ac-item${i===active?' on':''}" data-i="${i}">${esc(v)}</button>`).join('');
    list.classList.add('on');
  };
  const commit = ok => {
    if(closed) return; closed = true;
    const v = input.value.trim();
    if(ok && v !== (c[key] || '')){
      c[key] = v; rememberTag(key, v); touch(c); save(); renderAll();
    }else{ host.className = keepCls; host.innerHTML = keep; }
  };
  input.addEventListener('input', () => { active = -1; paint(); });
  input.addEventListener('blur', () => setTimeout(() => commit(true), 150));
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if(list.classList.contains('on')){
      if(e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(active+1, items.length-1); paint(); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(active-1, -1); paint(); return; }
      if(e.key === 'Enter' && active >= 0){ e.preventDefault(); input.value = items[active]; list.classList.remove('on'); return; }
    }
    if(e.key === 'Enter'){ e.preventDefault(); commit(true); }
    if(e.key === 'Escape'){ e.preventDefault(); commit(false); }
  });
  list.addEventListener('mousedown', e => {
    const b = e.target.closest('.ac-item'); if(!b) return;
    e.preventDefault(); input.value = items[+b.dataset.i];
    list.classList.remove('on'); input.focus();
  });
  paint();
}

function addLog(c, text){
  if(!text.trim()) return;
  c.logs = c.logs || [];
  c.logs.push({ id:uid(), ts:now(), text:text.trim(), source:'manual' });
  touch(c); save(); renderAll();
  setTimeout(()=>{ const i = $('logInput'); if(i) i.focus(); }, 0);
}

/* 新しく入力されたタグは登録簿にも入れておく（設定画面に出てくる）*/
function rememberTag(key, value){
  if(!value) return;
  state.tags = state.tags || { type:[], client:[] };
  state.tags[key] = state.tags[key] || [];
  if(!state.tags[key].includes(value)) state.tags[key].push(value);
}

function createCase(){
  const nameEl = $('nName'); if(!nameEl) return;
  const name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  const type = $('nType').value.trim(), client = $('nClient').value.trim();
  rememberTag('type', type); rememberTag('client', client);
  const c = { id:uid(), name, type, client,
    step:0, done:false, waiting:false, created:now(), updated:now(), logs:[], links:[] };
  state.cases.push(c);
  selectedId = c.id; lastTouched = c.id; mode = 'case';
  save(); renderAll();
}

function attachAutocomplete(inputId, listId, getPool){
  const input = $(inputId), list = $(listId);
  let items = [], active = -1;
  const close = () => { list.classList.remove('on'); active = -1; };
  function render(){
    const q = input.value.trim().toLowerCase();
    items = getPool().filter(v => v.toLowerCase().includes(q) && v.toLowerCase() !== q);
    if(!items.length){ close(); return; }
    list.innerHTML = items.map((v,i) =>
      `<button type="button" class="ac-item${i===active?' on':''}" data-i="${i}">${esc(v)}</button>`
    ).join('');
    list.classList.add('on');
  }
  const pick = i => { input.value = items[i]; close(); input.focus(); };
  input.addEventListener('input', () => { active = -1; render(); });
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => setTimeout(close, 140));
  input.addEventListener('keydown', e => {
    if(!list.classList.contains('on')) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(active+1, items.length-1); render(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(active-1, -1); render(); }
    else if(e.key === 'Enter' && active >= 0){ e.preventDefault(); pick(active); }
    else if(e.key === 'Escape'){ e.stopPropagation(); close(); }
  });
  list.addEventListener('mousedown', e => {
    const b = e.target.closest('.ac-item'); if(!b) return;
    e.preventDefault(); pick(+b.dataset.i);
  });
}

/* ---- events ---- */
document.addEventListener('click', async e => {
  const t = e.target;

  if(t.closest('#settingsBtn')){ renderSettings(); $('modalSettings').classList.add('on'); return; }

  const seg = t.closest('#langSeg .seg');
  if(seg){ applyLang(seg.dataset.lang); renderSettings(); return; }

  const themeSeg = t.closest('#themeSeg .seg');
  if(themeSeg){ applyTheme(themeSeg.dataset.theme); return; }


  const tagDel = t.closest('[data-tagdel]');
  if(tagDel){
    const key = tagDel.dataset.tagdel, value = tagDel.dataset.tagval;
    const n = usageOf(key, value);
    if(n && !await ask(T.confirmTagDelete(value, n))) return;
    state.tags = state.tags || { type:[], client:[] };
    state.tags[key] = (state.tags[key]||[]).filter(v => v !== value);
    state.cases.forEach(c => { if(c[key] === value) c[key] = ''; });
    if(filter[key] === value) filter[key] = null;
    save(); renderAll(); renderSettings(); return;
  }
  const tagAddBtn = t.closest('[data-tagaddbtn]');
  if(tagAddBtn){
    const key = tagAddBtn.dataset.tagaddbtn;
    const input = document.querySelector(`[data-tagadd="${key}"]`);
    const v = input.value.trim();
    if(!v){ input.focus(); return; }
    rememberTag(key, v); input.value = '';
    save(); renderSettings(); return;
  }

  const sortBtn = t.closest('[data-sort]');
  if(sortBtn){
    const k = sortBtn.dataset.sort;
    if(sortBy.key === k) sortBy.dir *= -1;
    else sortBy = { key:k, dir: k === 'name' ? 1 : -1 };
    state.sortBy = sortBy; save();
    renderHead(); renderList(); return;
  }

  const detailBtn = t.closest('[data-detail]');
  if(detailBtn){ openDetailModal(detailBtn.dataset.detail); return; }

  const toggle = t.closest('[data-toggle]');
  if(toggle){
    const c = state.cases.find(x => x.id === toggle.dataset.toggle);
    if(c && !c.done){ c.waiting = !c.waiting; touch(c); save(); renderAll(); }
    return;
  }

  const chip = t.closest('[data-status]');
  if(chip){
    const v = chip.dataset.status;
    filter.status = (filter.status === v && chip.classList.contains('side-item')) ? 'all' : v;
    renderAll(); return;
  }
  /* 値が空＝「All」なので、トグル解除と同じく null に戻す */
  const cl = t.closest('[data-client]');
  if(cl){ const v = cl.dataset.client;
    filter.client = (!v || filter.client === v) ? null : v; renderAll(); return; }
  const ty = t.closest('[data-type]');
  if(ty){ const v = ty.dataset.type;
    filter.type = (!v || filter.type === v) ? null : v; renderAll(); return; }

  const row = t.closest('.l-row');
  if(row){ selectedId = row.dataset.id; mode = 'case'; renderAll(); return; }

  const fieldHost = t.closest('[data-field]');
  if(fieldHost){ const c = current(); if(c) editField(c, fieldHost.dataset.field, fieldHost); return; }

  const nameHost = t.closest('#caseName');
  if(nameHost){ const c = current(); if(c) editName(c, nameHost); return; }

  if(t.closest('#toNew')){ mode = 'new'; renderDetail(); return; }
  if(t.closest('#backToCase')){ mode = 'case'; renderDetail(); return; }
  if(t.closest('#nCreate')){ createCase(); return; }

  const step = t.closest('[data-step]');
  if(step){ const c = current(); if(c) setStep(c, +step.dataset.step); return; }

  const logDel = t.closest('[data-log]');
  if(logDel){
    const c = current(); if(!c) return;
    c.logs = c.logs.filter(l=>l.id !== logDel.dataset.log);
    touch(c); save(); renderAll(); return;
  }
  const linkDel = t.closest('[data-link]');
  if(linkDel){
    const c = current(); if(!c) return;
    c.links = c.links.filter(l=>l.id !== linkDel.dataset.link);
    touch(c); save(); renderAll(); return;
  }
  if(t.closest('#addLink')){ openModal('modalLink'); return; }
  if(t.closest('#delCase')){
    const c = current(); if(!c) return;
    if(await ask(T.confirmDelete(c.name))){
      state.cases = state.cases.filter(x=>x.id!==c.id);
      selectedId = null;
      if(!state.cases.length) mode = 'new';
      save(); renderAll();
    }
    return;
  }
  if(t.closest('#newBtn')){ mode = 'new'; renderDetail(); return; }
  if(t.closest('[data-close]') || t.classList.contains('modal')){ closeModals(); return; }

  const s = t.closest('.seg');
  if(s){
    s.parentElement.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));
    s.classList.add('on'); return;
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'logInput'){
    const c = current(); if(!c) return;
    addLog(c, e.target.value); e.target.value = '';
    return;
  }
  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.tagadd){
    const key = e.target.dataset.tagadd, v = e.target.value.trim();
    if(v){ rememberTag(key, v); e.target.value=''; save(); renderSettings(); }
    return;
  }
  if(e.key === 'Enter' && ['nName','nType','nClient'].includes(e.target.id)){
    if(e.target.closest('.ac')?.querySelector('.ac-list.on')) return;
    e.preventDefault(); createCase(); return;
  }
  if(e.key === 'Escape'){
    if(document.querySelector('.modal.on')){ closeModals(); return; }
    if(mode === 'new' && state.cases.length){ mode = 'case'; renderDetail(); }
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('l-row')){
    e.preventDefault(); e.target.click();
  }
});

/* 重要度のドラッグ選択。行のクリック（案件選択）に伝播させない。 */
let priDrag = null;
const priVal = (el, e) => {
  const r = el.getBoundingClientRect();
  return Math.max(0, Math.min(5, Math.ceil((e.clientX - r.left) / (r.width / 5))));
};
const priPaint = (el, v) =>
  [...el.querySelectorAll('.pri-dot')].forEach((d,i) => d.classList.toggle('on', i < v));

document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.pri');
  if(!el) return;
  e.stopPropagation(); e.preventDefault();
  const c = state.cases.find(x => x.id === el.dataset.pri);
  if(!c) return;
  priDrag = { el, c };
  el.setPointerCapture(e.pointerId);
  priPaint(el, priVal(el, e));
}, true);

document.addEventListener('pointermove', e => {
  if(!priDrag) return;
  priPaint(priDrag.el, priVal(priDrag.el, e));
});

document.addEventListener('pointerup', e => {
  if(!priDrag) return;
  const { el, c } = priDrag; priDrag = null;
  let v = priVal(el, e);
  if(v === (c.priority || 0)) v = 0;      // 同じ値をなぞったら解除
  c.priority = v; touch(c); save(); renderAll();
});

document.addEventListener('click', e => {
  if(e.target.closest('.pri')) e.stopPropagation();
}, true);

document.addEventListener('dblclick', e => {
  const host = e.target.closest('[data-rename]');
  if(!host) return;
  e.preventDefault(); e.stopPropagation();
  const c = state.cases.find(x => x.id === host.dataset.rename);
  if(c) editName(c, host);
});

$('search').addEventListener('input', e => { filter.q = e.target.value; renderAll(); });

function openModal(id){
  const m = $(id);
  m.classList.add('on');
  const first = m.querySelector('input');
  if(first){ first.value=''; first.focus(); }
}
function closeModals(){
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'));
}

/* 案件ごとの詳細ウィンドウ */
let detailId = null;
function openDetailModal(id){
  const c = state.cases.find(x => x.id === id);
  if(!c) return;
  detailId = id;

  $('dtSub').textContent = [c.type, c.client, `${c.step}/10`].filter(Boolean).join(' ／ ');

        <div class="txt">${esc(l.text)}</div></div>`).join('')

  $('modalDetail').classList.add('on');
  $('dtMemo').focus();
}

$('dtSave').addEventListener('click', () => {

  touch(c); save(); renderAll();

});

$('lAdd').addEventListener('click', () => {

  if(!url){ $('lUrl').focus(); return; }

  c.links = c.links || [];
  c.links.push({ id:uid(), type, url });
  touch(c); save(); closeModals(); renderAll();
});

/* 初回に入れたサンプル、およびタグ登録簿の初期化をここで確定させる */
if(!state.tags){
  state.tags = { type: inUse('type'), client: inUse('client') };
  delete state.fresh; save();
}else if(state.fresh){ delete state.fresh; save(); }

/* ---- screen saver ---- */
let saverOn = false, idleTimer = null;
let saverDelay = 5 * 60 * 1000;   // 設定で 0 / 5分 / 15分

function paintClock(){
  if(!saverOn) return;
  const d = new Date();
  const alive = state.cases.filter(c => !c.done).length;
  $('saverClock').querySelector('.t').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  $('saverClock').querySelector('.n').textContent = alive + (T.saverCases || '');
  setTimeout(paintClock, 20000);
}
/* 【2026-08-14 断念】Tauri の setFullscreen は2度試して2度ともクラッシュ。
   CSS 側の真因（.upper の block 化）を直した後でも落ちたため、この API 自体が
   この環境で不安定と判断し、呼び出さない。
   フルスクリーンで見たい場合は、アプリのウィンドウを先に macOS の
   フルスクリーン（緑ボタン / Cmd+Ctrl+F）にしておけば、
   セーバーは CSS でその全面を埋めるので同じ結果になる。 */
/* 切替の瞬間はレイアウトが総入れ替えになる。その最中に毎フレーム
   12個の位置を書き換えると WebView が耐えられない可能性があるため、
   前後 900ms は物理の DOM 更新を止める。 */
function enterSaver(){
  if(saverOn || !saverDelay || document.querySelector('.modal.on')) return;
  saverOn = true;
  physPaused = true;
  document.body.classList.add('saver');
  setTimeout(() => { physPaused = false; }, 900);
  paintClock();
}
function exitSaver(){
  if(!saverOn) return;
  saverOn = false;
  physPaused = true;
  document.body.classList.remove('saver');
  setTimeout(() => { physPaused = false; }, 900);
}
function resetIdle(){
  exitSaver();
  clearTimeout(idleTimer);
  if(saverDelay) idleTimer = setTimeout(enterSaver, saverDelay);
}
['pointermove','pointerdown','keydown','wheel'].forEach(ev =>
  window.addEventListener(ev, resetIdle, { passive:true }));

/* ウィンドウが前面に無いときは数えない。
   裏に回っているアプリがセーバーに入っても意味がなく、
   戻ってきた瞬間に画面が変わっていて驚くだけ。 */
window.addEventListener('blur', () => {
  clearTimeout(idleTimer); idleTimer = null;
  exitSaver();
});
window.addEventListener('focus', resetIdle);
document.addEventListener('visibilitychange', () => {
  if(document.hidden){ clearTimeout(idleTimer); idleTimer = null; exitSaver(); }
  else resetIdle();
});

const SAVER_MAX = 15;   // 分

function paintSaver(min){
  const pct = (min / SAVER_MAX) * 100;
  const el = $('saverSlider'); if(!el) return;
  el.querySelector('.slider-fill').style.width = pct + '%';
  el.querySelector('.slider-knob').style.left = pct + '%';
  $('saverVal').textContent = min === 0 ? T.ssOff : min + T.minUnit;
}

function applySaver(ms){
  saverDelay = ms; state.saverDelay = ms; save();
  paintSaver(Math.round(ms / 60000));
  resetIdle();
}

function initSaverSlider(){
  const el = $('saverSlider'); if(!el || el.dataset.ready) return;
  el.dataset.ready = '1';
  const valAt = e => {
    const r = el.getBoundingClientRect();
    return Math.max(0, Math.min(SAVER_MAX,
      Math.round((e.clientX - r.left) / r.width * SAVER_MAX)));
  };
  let dragging = false;
  el.addEventListener('pointerdown', e => {
    dragging = true; el.setPointerCapture(e.pointerId);
    paintSaver(valAt(e));
  });
  el.addEventListener('pointermove', e => { if(dragging) paintSaver(valAt(e)); });
  const end = e => {
    if(!dragging) return; dragging = false;
    applySaver(valAt(e) * 60000);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

startPhysics();   // 物理は常時回す。境界は毎フレーム読むのでリサイズ追従は不要
applySaver(state.saverDelay === undefined ? saverDelay : state.saverDelay);

applyTheme(state.theme || 'ameba');
applyLang(state.lang || 'en');
loadFromFile();
</script>
</body>
</html>
